server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/email_classifier_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Python FastAPI Microservice Endpoint
fastapi.service.url=http://localhost:8000/predict
